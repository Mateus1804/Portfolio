name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verificar Node.js disponível
        run: node --version
      - name: Testes do painel demonstrativo
        run: node --test test/*.test.mjs
      - name: Integridade do site
        run: node scripts/check-site.mjs
